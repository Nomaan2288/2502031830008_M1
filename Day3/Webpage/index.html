<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4e7eff,#324fd6);
    min-height:100vh;
    padding:20px;
}

header{
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    border-radius:10px;
    padding:15px;
}

nav{
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    padding:10px 15px;
    border-radius:5px;
    transition:.3s;
}

nav a:hover{
    background:white;
    color:#324fd6;
}

.hero{
    text-align:center;
    color:white;
    margin:50px 0;
}

.hero h1{
    font-size:50px;
    margin-bottom:15px;
}

.hero p{
    font-size:20px;
}

.Main{
    background:white;
    border-radius:15px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.Main h2{
    text-align:center;
    margin-bottom:15px;
}

.btnn{
    text-align:center;
    margin-top:25px;
}

.btn{
    background:gold;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

footer{
    margin-top:20px;
    text-align:center;
    color:white;
    background:#2c1035;
    padding:20px;
    border-radius:10px;
}

</style>
</head>

<body>

<header>
<nav>
    <a href="index.html">Home</a>
    <a href="About.html">About</a>
    <a href="signup.html">Signup</a>
    <a href="Login.html">Login</a>
</nav>
</header>

<section class="hero">
    <h1>Welcome To Our Website</h1>
    <p>Simple • Modern • Responsive</p>
</section>

<section class="Main">

    <h2>Simple Static Website</h2>

    <p>
        Welcome to our sample website. This project demonstrates
        a clean and modern webpage design using HTML and CSS.
        Navigate through the pages to explore more content.
    </p>

    <div class="btnn">
        <a href="signup.html">
            <button class="btn">Get Started</button>
        </a>
    </div>

</section>

<footer>
    <h3>Simple Website</h3>
    <p>Designed By Noman</p>
</footer>

</body>
</html>
