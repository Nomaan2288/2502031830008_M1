<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4e7eff,#324fd6);
    min-height:100vh;
    padding:20px;
}

header{
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    border-radius:10px;
    padding:15px;
}

nav{
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    padding:10px 15px;
    border-radius:5px;
    transition:.3s;
}

nav a:hover{
    background:white;
    color:#324fd6;
}

h2{
    text-align:center;
    color:white;
    margin:40px 0 20px;
    font-size:40px;
}

.Main{
    max-width:450px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.Main h1{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

label{
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#324fd6;
}

.btnn{
    text-align:center;
}

.btn{
    background:gold;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    background:#ffd700;
}

.signup-link{
    text-align:center;
    margin-top:20px;
}

.signup-link a{
    color:#324fd6;
    text-decoration:none;
    font-weight:bold;
}

footer{
    margin-top:30px;
    text-align:center;
    color:white;
    background:#2c1035;
    padding:20px;
    border-radius:10px;
}

</style>
</head>

<body>

<header>
<nav>
    <a href="index.html">Home</a>
    <a href="About.html">About</a>
    <a href="signup.html">Signup</a>
    <a href="Login.html">Login</a>
</nav>
</header>

<h2>Login</h2>

<section class="Main">

    <h1>Welcome Back</h1>

    <form action="index.html">

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <div class="btnn">
            <button class="btn">Login</button>
        </div>

    </form>

    <div class="signup-link">
        <p>Don't have an account? <a href="signup.html">Signup</a></p>
    </div>

</section>

<footer>
    <h3>Simple Website</h3>
    <p>Designed By Noman</p>
</footer>

</body>
</html>
