<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#4e7eff,#324fd6);
    min-height:100vh;
    padding:20px;
}

header{
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(10px);
    border-radius:10px;
    padding:15px;
}

nav{
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    padding:10px 15px;
    border-radius:5px;
    transition:.3s;
}

nav a:hover{
    background:white;
    color:#324fd6;
}

h2{
    text-align:center;
    color:white;
    margin:30px 0;
    font-size:40px;
}

.Main{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.Main h1{
    text-align:center;
    margin-bottom:20px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
}

input:focus{
    outline:none;
    border-color:#324fd6;
}

.btnn{
    text-align:center;
}

.btn{
    background:gold;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

footer{
    margin-top:20px;
    text-align:center;
    color:white;
    background:#2c1035;
    padding:20px;
    border-radius:10px;
}

</style>
</head>

<body>

<header>
<nav>
    <a href="index.html">Home</a>
    <a href="About.html">About</a>
    <a href="Login.html">Login</a>
</nav>
</header>

<h2>Signup</h2>

<section class="Main">

<h1>Create Account</h1>

<form action="index.html">

<label>First Name</label>
<input type="text" placeholder="Enter First Name">

<label>Last Name</label>
<input type="text" placeholder="Enter Last Name">

<label>Mobile Number</label>
<input type="number" placeholder="Enter Mobile Number">

<label>Email</label>
<input type="email" placeholder="Enter Email">

<label>Address</label>
<input type="text" placeholder="Enter Address">

<label>Designation</label>
<input type="text" placeholder="Enter Designation">

<div class="btnn">
<button class="btn">Get Started</button>
</div>

</form>

</section>

<footer>
    <h3>Simple Website</h3>
    <p>Designed By Noman</p>
</footer>

</body>
</html>
