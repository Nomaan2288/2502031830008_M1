<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Press Event</title>
</head>

<body>
    <h1>Key Press Event using Keypress </h1>
    <p>Press any key to display Current Date :</p>
    <input type="text" id="key">
    <script>
        var key = document.getElementById("key");
        key.addEventListener("keypress",()=>{
        var a = new Date();
        alert(a)
        });
    </script>
</body>
</html>
