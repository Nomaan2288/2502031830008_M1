<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <style>
        body{
            background-color:burlywood;
        }
        h1 {
            text-align: center;
            background-color: aliceblue;
            font-weight: bolder;
        }
        form{
            background-color: aliceblue;
            text-align: center;
            font-weight: bolder;
        }
        #Submit{
            background-color:blanchedalmond;
            font-weight: bolder;
        }
        #Reset{
            background-color:blanchedalmond;
            font-weight: bolder;
        }

    </style>
</head>
<body>
    <h1>Form Validation Program</h1>
    <form name="RegForm" id="RegForm" >
        <label for="name">Name:</label>
        <input type="text" name="name" id="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br><br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password"><br><br>

        <label for="contact">Contact Number</label>
        <input type="number" name="contact" id="contact"><br><br>

        <label for="subject">Select Your Course:</label>
            <select name="subject" id="subject">
                <option value="Diploma">Diploma</option>
                <option value="B.Tech">B.Tech</option>
                <option value="M.Tech">M.Tech</option>
            </select><br><br>

        <label for="Comment">Comment:</label>
        <input type="text" id="comment" style="height: 50px; width: 200px;"><br><br>

        <input type="button" value="Submit" id="Submit" name="Submit" onclick="validate()">
        <input type="button" value="Reset" id="Reset" name="Reset" >
    </form>
    <script>
        function validate(){
            var form1 = document.getElementById("RegForm");
            var name = form1.name.value;
            var email = form1.email.value;
            var password = form1.password.value;
            var number = form1.contact.value;
            var what = form1.subject.value;

            var regEmail = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/g;
            var regPhone=/^\d{10}$/;


            if(name == ""){
                window.alert("Please Enter A Name");
                return false;
            }else if(email == "" || !regEmail.test(email)){
                window.alert("Please enter a valid e-mail address.");
                return false;
            }else if(password == ""){
                alert("Please enter your password");
                return false;
            }else if(password.length < 6 ){
                alert("Password should be atleast 6 character long");
                return false;
            }else if(number == "" || !regPhone.test(number)){
                alert("Please enter valid phone number.");
                return false;
            }else if(what.selectedIndex == -1){
                alert("Please enter your course.");
                return false;
            }

        }
    </script>
</body>
</html>
