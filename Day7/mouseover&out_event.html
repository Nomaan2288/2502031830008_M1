<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Over And Out Event</title>
</head>
<body>
    <h1>Bulb ON And OFF Program using EventListener</h1>
    <img src="bulboff.jpg" alt="" id="bulb"> 
</body>
<script>
    var a = document.getElementById("bulb");
    a.addEventListener("mouseover",()=>{
    a.src= "bulbon.jpg";
    });
    a.addEventListener("mouseout",()=>{
    a.src= "bulboff.jpg";
    });
    </script>
</html>
