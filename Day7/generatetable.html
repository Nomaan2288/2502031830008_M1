<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Table</title>
</head>
<body>
    <h1>Generate Table  Using Click Event</h1>
    <label for="row">Enter Row:</label>
    <input type="text" id="row" placeholder="Enter Row"><br>

    <label for="column">Enter Column:</label>
    <input type="text" id="column" placeholder="Enter Column"><br>

    <input type="button" value="Generate Table" id="btn1">

    <script>
        var row = document.getElementById("row");
        var column = document.getElementById("column");
        var btn1 = document.getElementById("btn1");

        btn1.addEventListener("click", ()=>{
            document.write("<table border='2' width='50%'>");
                for(let i=0; i<row.value; i++)
            {
                document.write("<tr>")
                    for(j=0; j<column.value; j++)
                {
                    document.write("<td>" + "[" +i+ "]" + "[" +j+"]" + "</td>");
                }
                document.write("</tr>");
            }
            document.write("</table>")
        })

    </script>
    
</body>
</html>
