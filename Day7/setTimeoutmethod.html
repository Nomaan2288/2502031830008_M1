<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Time Out Method </title>
</head>
<body>
    <h1>setTimeOut Method</h1>

    <h4>The setTimeout() method executes a function, after waiting a specified number of milliseconds.</h4>
    <h3>Syntax:</h3>
    <h4>setTimeout(function, milliseconds);</h4>

    <script>
        setTimeout(callme,2000);
        function callme() {
        alert('Welcome in ASOIT');
        }
    </script>

    
</body>
</html>
