<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus And Change Event</title>
</head>
<body>
    <h1>
        Focus And Change Event
    </h1>

    <label for="product"> Select A Product</label>
    <select name="product" id="product">
        <option value="45000">AC</option>
        <option value="22000">TV</option>
        <option value="15000">Refrigerator</option>
        <option value="70000">Laptop</option>
    </select><br><br>

    <label for="netprize">Net Prize:</label>
    <input type="text" name="netprize" id="netprize"><br><br>

    <label for="quantity">Quantity</label>
    <input type="text" name="quantity" id="quantity"><br><br>

    <label for="amount">Total Amount</label>
    <input type="text" name="amount" id="amount"><br><br>

    <script>
        var product = document.getElementById("product");
        var quantity = document.getElementById("quantity");
        var amount = document.getElementById("amount");
        var prize = document.getElementById("netprize");

        product.addEventListener("change",()=>{
            prize.value = product.value;
            });

        amount.addEventListener("focus",()=>{
            amount.value=product.value * quantity.value;
            });

    </script>
</body>
</html>
